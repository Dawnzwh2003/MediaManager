[package]
name = "media-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "media_manager"

[[bin]]
name = "media-manager"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dependencies]
fs2 = "=0.4.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", optional = true , features = ["protocol-asset"] }
thiserror = "=2.0.17"

[dev-dependencies]
tempfile = "=3.23.0"
